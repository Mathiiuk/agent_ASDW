name: Continuous Integration & Quality Gates

on:
  push:
    branches:
      - main
      - staging
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
  pull_request:
    branches:
      - main
      - staging

jobs:
  validate:
    name: Test & Quality Gates (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Entorno Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 📦 Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: 📥 Instalar Dependencias
        run: pnpm install --frozen-lockfile

      - name: 🧪 Ejecutar Pruebas Unitarias (Vitest)
        run: pnpm test

      - name: 🥒 Ejecutar Pruebas de Comportamiento BDD (Cucumber)
        run: pnpm test:bdd

      - name: 🤖 Validar CLI del Agente
        run: node ./bin/agente-dev.js task:list

      - name: 🛡️ Auditoría de Seguridad de Dependencias
        run: pnpm audit --audit-level=high || true
